name: Publish Container Images

on:
  push:
    branches:
      - main
    paths:
      - 'backend/src/Api.Host/**'
      - 'backend/src/RndKnowledgeMining.Governance/**'
      - 'backend/src/RndKnowledgeMining.Mcp/**'
      - 'agent-provisioning/**'
      - 'frontend/**'
      - 'policies/**'
      - '.dockerignore'
      - 'global.json'
      - 'NuGet.config'
      - '.github/workflows/publish-container-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REPOSITORY_OWNER: foundry-industry-sandbox

jobs:
  publish:
    runs-on: ubuntu-latest
    #runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: coherernd-api
            dockerfile: backend/src/Api.Host/Dockerfile
          - image: coherernd-mcp
            dockerfile: backend/src/RndKnowledgeMining.Mcp/Dockerfile
          - image: coherernd-web
            dockerfile: frontend/src/WebApp/Dockerfile
          - image: coherernd-provisioning
            dockerfile: agent-provisioning/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY_OWNER }}/${{ matrix.image }}:demo
            ${{ env.REGISTRY }}/${{ env.REPOSITORY_OWNER }}/${{ matrix.image }}:${{ github.sha }}
