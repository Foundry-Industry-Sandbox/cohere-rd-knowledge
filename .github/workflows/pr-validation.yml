name: PR Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'agent-provisioning/**'
      - 'frontend/**'
      - 'global.json'
      - 'NuGet.config'
      - 'infra/**'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    #runs-on: self-hosted
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      bicep: ${{ steps.filter.outputs.bicep }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dotnet:
              - 'backend/**'
              - 'agent-provisioning/**'
              - 'frontend/**'
              - 'global.json'
              - 'NuGet.config'
              - 'frontend/Cohere.AgenticRDKnowledge.sln'
              - '.github/workflows/**'
            bicep:
              - 'infra/**'
              - '.github/workflows/**'

  dotnet-validation:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET projects
        run: |
          dotnet restore backend/src/Api.Host/CohereRndKnowledgeMining.Api.Host.csproj --configfile NuGet.config --source https://packagefeedproxy.microsoft.io/nuget/v3/index.json
          dotnet restore backend/src/RndKnowledgeMining.Mcp/RndKnowledgeMining.Mcp.csproj --configfile NuGet.config --source https://packagefeedproxy.microsoft.io/nuget/v3/index.json
          dotnet restore frontend/src/WebApp/Cohere.AgenticRDKnowledge.WebApp.csproj --configfile NuGet.config --source https://packagefeedproxy.microsoft.io/nuget/v3/index.json
          dotnet restore agent-provisioning/src/CohereRndKnowledge.AgentProvisioning/CohereRndKnowledge.AgentProvisioning.csproj --configfile NuGet.config --source https://packagefeedproxy.microsoft.io/nuget/v3/index.json

      - name: Build Api.Host
        run: dotnet build backend/src/Api.Host/CohereRndKnowledgeMining.Api.Host.csproj -c Release -m:1 --no-restore

      - name: Build Mcp
        run: dotnet build backend/src/RndKnowledgeMining.Mcp/RndKnowledgeMining.Mcp.csproj -c Release --no-restore

      - name: Build WebApp
        run: dotnet build frontend/src/WebApp/Cohere.AgenticRDKnowledge.WebApp.csproj -c Release --no-restore

      - name: Build AgentProvisioning
        run: dotnet build agent-provisioning/src/CohereRndKnowledge.AgentProvisioning/CohereRndKnowledge.AgentProvisioning.csproj -c Release --no-restore

  bicep-validation:
    needs: changes
    if: needs.changes.outputs.bicep == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: az bicep install

      - name: Build Bicep
        run: az bicep build --file infra/main.bicep
